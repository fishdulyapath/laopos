services:
  marketplace-api:
    build:
      context: ../MarketPlaceWebServiceExpress
    image: marketplace-web-service-express:bizsuit-local
    environment:
      NODE_ENV: production
      PORT: 47300
      DB_HOST: ${DB_HOST:?set DB_HOST in your shell or env file}
      DB_PORT: ${DB_PORT:?set DB_PORT in your shell or env file}
      DB_USER: ${DB_USER:?set DB_USER in your shell or env file}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your shell or env file}
      DB_NAME: ${DB_NAME:?set DB_NAME in your shell or env file}
      DB_IMAGES_NAME: ${DB_IMAGES_NAME:?set DB_IMAGES_NAME in your shell or env file}
      ONEPAY_BASE_URL: ${ONEPAY_BASE_URL}
      ONEPAY_USERNAME: ${ONEPAY_USERNAME}
      ONEPAY_PASSWORD: ${ONEPAY_PASSWORD}
      ONEPAY_MCID: ${ONEPAY_MCID}
      ONEPAY_MERCHANT_NAME: ${ONEPAY_MERCHANT_NAME}
      ONEPAY_MCC: ${ONEPAY_MCC}
      ONEPAY_SHOPCODE: ${ONEPAY_SHOPCODE}
      ONEPAY_ACCOUNTNO: ${ONEPAY_ACCOUNTNO}
      ONEPAY_QR_TRANSFER_PASS_BOOK_CODE: ${ONEPAY_QR_TRANSFER_PASS_BOOK_CODE}
      SELL_SUMMARY_CURRENCY_CODES: ${SELL_SUMMARY_CURRENCY_CODES}
      CUSTOMER_DISPLAY_UPLOAD_DIR: /app/uploads/customer-display
    volumes:
      - customer_display_uploads:/app/uploads/customer-display
    expose:
      - "47300"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:47300/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  bizsuit-web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${BIZSUIT_VITE_API_BASE_URL:-/service/v1}
        VITE_BASE_PATH: ${BIZSUIT_VITE_BASE_PATH:-/bizsuit/}
        VITE_TIGER_MOCK: ${BIZSUIT_VITE_TIGER_MOCK:-false}
        VITE_CHANGE_CURRENCY_CODE: ${BIZSUIT_VITE_CHANGE_CURRENCY_CODE:-KIP}
        VITE_CHANGE_ROUNDING_STEP: ${BIZSUIT_VITE_CHANGE_ROUNDING_STEP:-500}
        VITE_CHANGE_ROUNDING_MODE: ${BIZSUIT_VITE_CHANGE_ROUNDING_MODE:-down}
        VITE_CHANGE_ROUNDING_INCOME_CODE: ${BIZSUIT_VITE_CHANGE_ROUNDING_INCOME_CODE:-RD-002}
    image: bizsuit-web:local
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  bizsuit-proxy:
    image: nginx:1.27-alpine
    ports:
      - "${BIZSUIT_STACK_PORT:-8091}:80"
    volumes:
      - ./deploy/nginx.fullstack.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      marketplace-api:
        condition: service_healthy
      bizsuit-web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  customer_display_uploads:
