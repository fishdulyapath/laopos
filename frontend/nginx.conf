server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /bizsuit {
        return 301 /bizsuit/;
    }

    location = /bizsuit/index.html {
        add_header Cache-Control "no-store" always;
        try_files /bizsuit/index.html =404;
    }

    location /bizsuit/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /bizsuit/index.html;
    }

    location ~* ^/bizsuit/.+\.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}
