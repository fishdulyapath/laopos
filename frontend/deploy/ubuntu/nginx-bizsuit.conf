upstream bizsuit_app {
    server bizsuit-app:80;
}

upstream bizsuit_api {
    server bizsuit-api:47300;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /api-health {
        proxy_pass http://bizsuit_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /bizsuit {
        return 301 /bizsuit/;
    }

    location /bizsuit/ {
        proxy_pass http://bizsuit_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /service/uploads/ {
        proxy_pass http://bizsuit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_cache_valid 200 206 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
    }

    location /service/ {
        proxy_pass http://bizsuit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header ngrok-skip-browser-warning $http_ngrok_skip_browser_warning;
    }

    location = /santipab.png {
        proxy_pass http://bizsuit_app/bizsuit/santipab.png;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 302 /bizsuit/;
    }
}
