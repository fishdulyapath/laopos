services:
  laoposservice:
    image: ${LAOPOS_SERVICE_IMAGE:-minorsoft/laoposservice:latest}
    container_name: laoposservice
    restart: always
    expose:
      - "47300"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_IMAGES_NAME: ${DB_IMAGES_NAME}
      ONEPAY_BASE_URL: ${ONEPAY_BASE_URL}
      ONEPAY_USERNAME: ${ONEPAY_USERNAME}
      ONEPAY_PASSWORD: ${ONEPAY_PASSWORD}
      ONEPAY_MCID: ${ONEPAY_MCID}
      ONEPAY_MERCHANT_NAME: ${ONEPAY_MERCHANT_NAME}
      ONEPAY_MCC: ${ONEPAY_MCC}
      ONEPAY_SHOPCODE: ${ONEPAY_SHOPCODE}
      ONEPAY_ACCOUNTNO: ${ONEPAY_ACCOUNTNO}
      ONEPAY_QR_TRANSFER_PASS_BOOK_CODE: ${ONEPAY_QR_TRANSFER_PASS_BOOK_CODE}
      SELL_SUMMARY_CURRENCY_CODES: ${SELL_SUMMARY_CURRENCY_CODES}
      CUSTOMER_DISPLAY_UPLOAD_DIR: /app/uploads/customer-display
      PORT: 47300
    volumes:
      - customer_display_uploads:/app/uploads/customer-display
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - laopos_net
      - sml_service_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:47300/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  laoposweb:
    image: ${LAOPOS_WEB_IMAGE:-minorsoft/laoposweb:latest}
    container_name: laoposweb
    restart: always
    depends_on:
      laoposservice:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - laopos_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: laopos-nginx
    restart: always
    ports:
      - "${LAOPOS_STACK_PORT:-8081}:80"
    volumes:
      - ./nginx-laopos.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      laoposweb:
        condition: service_healthy
      laoposservice:
        condition: service_healthy
    networks:
      - laopos_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  customer_display_uploads:

networks:
  laopos_net:
    driver: bridge
  sml_service_network:
    external: true
